<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Contact — Noopur Kashyap</title>

  <!-- FONTS -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="./css/contact.css">
</head>

<body>

  <!-- NAVBAR -->
  <header class="navbar">

    <!-- LOGO -->
    <a href="index.html" class="logo">
      <img src="images/logo.png" alt="Noopur Kashyap Logo">
    </a>

    <!-- NAV -->
    <nav class="nav-links">
      <a href="about.html">About</a>
      <a href="projects.html">Projects</a>
      <a href="contact.html">Contact</a>
    </nav>

  </header>

  <!-- MAIN -->
  <main class="contact-page">

    <div class="contact-content">

      <!-- TITLE -->
      <h1 class="hero-title">
        Let’s connect
      </h1>

      <!-- SUBTEXT -->
      <p class="hero-sub">
        Open to design conversations, collaborations, research, and opportunities.
      </p>

      <!-- EMAIL -->
      <div class="email-wrapper">

        <button 
          class="email-link" 
          id="copyEmail"
          data-email="hello@noopurkashyap.com"
        >
          noopurkkashyap@gmail.com
        </button>

        <span class="email-tooltip" id="emailTooltip">
          Click to copy
        </span>

      </div>

      <!-- BOTTOM -->
      <div class="bottom-row">

        <!-- SOCIALS -->
        <div class="social-links">

          <!-- LINKEDIN -->
          <a href="#" class="social-icon">

            <img 
              src="images/linkedin.png"
              class="icon-default"
              alt="LinkedIn"
            >

            <img 
              src="images/linkedin_hover.png"
              class="icon-hover"
              alt="LinkedIn Hover"
            >

          </a>

          <!-- INSTAGRAM -->
          <a href="#" class="social-icon">

            <img 
              src="images/instagram.png"
              class="icon-default"
              alt="Instagram"
            >

            <img 
              src="images/instagram_hover.png"
              class="icon-hover"
              alt="Instagram Hover"
            >

          </a>

          <!-- MEDIUM -->
          <a href="#" class="social-icon">

            <img 
              src="images/medium.png"
              class="icon-default"
              alt="Medium"
            >

            <img 
              src="images/medium_hover.png"
              class="icon-hover"
              alt="Medium Hover"
            >

          </a>

        </div>

        <!-- RESUME -->
        <a href="#" class="resume-btn">
          Download Resume
        </a>

      </div>

    </div>

  </main>

  <!-- BOAT -->
<img 
  src="images/boat.svg" 
  alt="Boat Illustration"
  class="boat-image"
/>
  <!-- JS -->
  <script>

    const emailButton = document.getElementById("copyEmail");
    const tooltip = document.getElementById("emailTooltip");

    emailButton.addEventListener("click", async () => {

      const email = emailButton.dataset.email;

      try {

        await navigator.clipboard.writeText(email);

        tooltip.textContent = "Copied to clipboard";

        setTimeout(() => {
          tooltip.textContent = "Click to copy";
        }, 2000);

      } catch (err) {

        tooltip.textContent = "Failed to copy";

      }

    });

  </script>

</body>
</html>
