<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contact — Noopur Kashyap</title>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/contact.css">
</head>

<body>

<!-- TOP NAV -->
<header class="top-nav">
  <div class="nav-left">Noopur</div>
  <div class="nav-right">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="projects.html">Projects</a>
  </div>
</header>

<!-- MAIN -->
<section class="contact-container">

  <!-- LEFT -->
  <div class="contact-left">
    <h1>Let’s connect</h1>
    <p>
      Have a project in mind, want to collaborate, or just want to say hi?  
      I’d love to hear from you.
    </p>

    <div class="contact-info">
      <p>📩 hello@noopurkashyap.com</p>
      <p>🔗 linkedin.com/in/noopur-kashyap</p>
      <p>📄 <a href="#">Download Resume</a></p>
    </div>
  </div>

  <!-- RIGHT -->
  <div class="contact-right">
    <form class="contact-form">

      <div class="row">
        <input type="text" placeholder="Name" required>
        <input type="email" placeholder="Email" required>
      </div>

      <input type="text" placeholder="Subject">

      <textarea placeholder="Message" rows="5" required></textarea>

      <button type="submit">Start a conversation</button>

    </form>
  </div>

</section>

</body>
</html>
