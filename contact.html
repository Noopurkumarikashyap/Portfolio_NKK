<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Contact — Noopur Kashyap</title>

  <!-- FONTS -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="./css/contact.css">
</head>

<body>

  <!-- NAVBAR -->
  <header class="navbar">

    <!-- LOGO -->
    <a href="index.html" class="logo">
      <img src="images/logo.png" alt="Noopur Kashyap Logo">
    </a>

    <!-- NAV -->
    <nav class="nav-links">
      <a href="about.html">About</a>
      <a href="projects.html">Projects</a>
      <a href="contact.html">Contact</a>
    </nav>

  </header>

  <!-- MAIN -->
  <main class="contact-page">

    <div class="contact-content">

      <h1 class="hero-title">
        Let’s connect
      </h1>

      <p class="hero-sub">
        Open to design conversations, collaborations, research, and opportunities.
      </p>

      <div class="email-wrapper">

  <button 
    class="email-link" 
    id="copyEmail"
    data-email="hello@noopurkashyap.com"
  >
    hello@noopurkashyap.com
  </button>

  <span class="email-tooltip" id="emailTooltip">
    Click to copy
  </span>

</div>

      <div class="bottom-row">

        <!-- SOCIALS -->
        <div class="social-links">

  <a href="#" class="linkedin">
    <img src="images/linkedin.png" alt="LinkedIn">
  </a>

  <a href="#" class="instagram">
    <img src="images/instagram.png" alt="Instagram">
  </a>

  <a href="#" class="medium">
    <img src="images/medium.png" alt="Medium">
  </a>

</div>

        <!-- BUTTON -->
        <a href="#" class="resume-btn">
          Download Resume
        </a>

      </div>

    </div>

  </main>
<script>

const emailButton = document.getElementById("copyEmail");
const tooltip = document.getElementById("emailTooltip");

emailButton.addEventListener("click", async () => {

  const email = emailButton.dataset.email;

  try {

    await navigator.clipboard.writeText(email);

    tooltip.textContent = "Copied to clipboard";

    setTimeout(() => {
      tooltip.textContent = "Click to copy";
    }, 2000);

  } catch (err) {

    tooltip.textContent = "Failed to copy";

  }

});

</script>
</body>
</html>
